<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2D5F2D">
    <meta name="description" content="タスクを解析してGoogleカレンダーに同期するPWA">
    <title>Task Sync - タスク同期アプリ</title>
    
    <!-- PWA設定 -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <!-- 見た目と動きは別ファイル（Content-Security-Policy でインラインの style・script を禁止しているため） -->
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Task Sync</h1>
            <p>タスクを解析してGoogleカレンダーに同期</p>
        </div>
        
        <!-- PWAインストールプロンプト -->
        <div class="install-prompt" id="installPrompt">
            <span>📱 ホーム画面に追加してアプリとして使えます</span>
            <button id="installBtn">追加</button>
        </div>
        
        <!-- タブ -->
        <div class="tabs">
            <button class="tab active" data-tab="parse">解析</button>
            <button class="tab" data-tab="history">履歴</button>
            <button class="tab" data-tab="stats">統計</button>
        </div>
        
        <!-- タブ1: 解析 -->
        <div class="tab-content active" id="tab-parse">
            <div class="card">
                <div class="input-group">
                    <label for="taskInput">タスクを入力（1行1タスク）</label>
                    <textarea id="taskInput" placeholder="例：&#10;青鳳会の会議資料準備 (3/15まで)&#10;お寺の掃除 (早め)&#10;詠道部の練習 (5月中)"></textarea>
                    <div class="example">
                        💡 日付の書き方: (3/15まで) (5月中) (早め) (至急) (来週まで)
                    </div>
                </div>
                
                <button class="btn btn-primary" id="parseBtn">解析する</button>
                
                <div class="loading" id="loading">
                    <p>⏳ 解析中...</p>
                </div>
                
                <div class="error" id="error"></div>
                <div class="success" id="success"></div>
            </div>
            
            <div class="card results" id="results">
                <h3 class="card-title">📊 解析結果</h3>
                <div id="taskList"></div>
                <button class="btn btn-success sync-btn" id="syncBtn">📅 Googleカレンダーに同期</button>
            </div>
        </div>
        
        <!-- タブ2: 履歴 -->
        <div class="tab-content" id="tab-history">
            <div class="card">
                <h3 class="card-title">📜 タスク履歴</h3>
                <div id="historyList">
                    <p class="muted">読み込み中...</p>
                </div>
            </div>
        </div>
        
        <!-- タブ3: 統計 -->
        <div class="tab-content" id="tab-stats">
            <div class="card">
                <h3 class="card-title">📈 統計情報</h3>
                <div class="stats" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-number" id="statTotal">-</div>
                        <div class="stat-label">総タスク数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statMonth">-</div>
                        <div class="stat-label">今月</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statSynced">-</div>
                        <div class="stat-label">同期済み</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statPending">-</div>
                        <div class="stat-label">未同期</div>
                    </div>
                </div>
                <div id="categoryStats"></div>
            </div>
        </div>
    </div>
    
</body>
</html>
